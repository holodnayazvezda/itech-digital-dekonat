<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 136" fill="none" role="img" aria-labelledby="title">
  <title id="title">Тинки — помощник кампуса</title>
  <style>
    :root { color:#000; --paper:#fff; }
    @media(prefers-color-scheme:dark) { :root { color:#fff; --paper:#000; } }
    .eyes { transform-box:fill-box; transform-origin:center; animation:blink 6.2s infinite; }
    @keyframes blink { 0%,43%,47%,91%,95%,100% {transform:scaleY(1)} 45%,93% {transform:scaleY(.08)} }
    @media(prefers-reduced-motion:reduce) { .eyes {animation:none} }
  </style>
  <path fill="currentColor" d="M60 5c13 0 20 7 26 16 4 6 15 5 23 18 10 16 7 33-5 43-7 6-7 17-15 24-8 7-19 6-29 6s-21 1-29-6c-8-7-8-18-15-24C4 72 1 55 11 39c8-13 19-12 23-18C40 12 47 5 60 5Z"/>
  <g class="eyes" fill="var(--paper)"><rect x="40" y="44" width="10" height="29" rx="5"/><rect x="70" y="44" width="10" height="29" rx="5"/></g>
  <rect x="40" y="122" width="40" height="9" rx="4.5" fill="currentColor"/>
</svg>
